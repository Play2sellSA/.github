name: CI
# Self-tests das actions canônicas da frota (guard + gate).
# Required check deste repo: mudança nas actions só entra com a matriz verde.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-tests:
    name: 🧪 Action self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-test matrix (guard + gate)
        run: bash scripts/tests/run_tests.sh
